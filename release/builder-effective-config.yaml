directories:
  output: release
  buildResources: build
appId: com.vitrinetv.app
productName: VitrineTV
files:
  - filter:
      - dist/**/*
      - electron/**/*
mac:
  category: public.app-category.video
  icon: public/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  icon: public/icon.ico
  target:
    - target: nsis
      arch:
        - x64
linux:
  icon: public/icon.png
  target:
    - AppImage
    - deb
dmg:
  title: VitrineTV
  contents:
    - x: 130
      'y': 220
    - x: 410
      'y': 220
      type: link
      path: /Applications
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
electronVersion: 42.4.1
