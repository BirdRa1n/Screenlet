name: Release

# Publishes the desktop app to GitHub Releases on every version tag (including
# prereleases like v1.0.0-beta.1). electron-builder uploads the installers plus
# the update metadata (latest-mac.yml / latest.yml) that electron-updater reads,
# so the in-app "Atualização disponível" check works against these releases.
#
# The macOS and Windows jobs run SEQUENTIALLY on purpose: if both published in
# parallel, each electron-builder run would race to create the release for the
# tag and GitHub would end up with two duplicate releases splitting the assets
# (and breaking auto-update, since latest-mac.yml and latest.yml would live on
# different releases). Running macOS first creates the release; Windows then
# finds it and appends its assets.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build and publish (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple signing cert in CI (beta): build unsigned rather than fail.
          # macOS auto-update apply needs a signed build — see release notes.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run release:mac

  release-win:
    needs: release-mac
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build and publish (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run release:win
